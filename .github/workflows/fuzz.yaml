name: Fuzz smoke tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2
  UV_VERSION: "0.12.x"

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parser
            max_len: 65536
          - target: formatter
            max_len: 65536
          - target: package_manifest
            max_len: 65536
          - target: package_lockfile
            max_len: 131072
          - target: plugin_manifest
            max_len: 262144
          - target: plugin_section
            max_len: 524288
          - target: generated_project
            max_len: 4096
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      MAX_LEN: ${{ matrix.max_len }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: matrix.target == 'parser'
        with:
          tool: cargo-deny@0.20.2

      - name: Check generated dictionary
        run: |
          ./internals/generate-fuzz-dictionary.py
          git diff --exit-code fuzz/graphcal.dict

      - name: Check fuzz dependency policy
        if: matrix.target == 'parser'
        run: >-
          cargo deny
          --manifest-path fuzz/Cargo.toml
          --config fuzz/deny.toml
          --locked check
          --hide-inclusion-graph

      - name: Build fuzz target
        run: cargo +nightly fuzz build "$FUZZ_TARGET" --fuzz-dir fuzz

      - name: Smoke-test fuzz target
        run: >-
          cargo +nightly fuzz run "$FUZZ_TARGET"
          "fuzz/corpus/$FUZZ_TARGET"
          --fuzz-dir fuzz --
          -runs=250
          -max_len="$MAX_LEN"
          -timeout=10
          -dict=fuzz/graphcal.dict

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  fuzz-gate:
    needs: fuzz
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check fuzz results
        env:
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          if [[ "$FUZZ_RESULT" != "success" ]]; then
            echo "One or more fuzz jobs failed"
            exit 1
          fi
          echo "All fuzz jobs passed"

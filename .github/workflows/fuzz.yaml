name: Fuzz smoke tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2
  UV_VERSION: "0.12.x"

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ${{ github.repository == 'graphcal-lang/graphcal' && format('namespace-profile-4x8-ubuntu-2604;overrides.cache-tag=graphcal-fuzz-{0}', matrix.cache_tag) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parser
            cache_tag: parser
            max_len: 65536
          - target: formatter
            cache_tag: formatter
            max_len: 65536
          - target: package_manifest
            cache_tag: package-manifest
            max_len: 65536
          - target: package_lockfile
            cache_tag: package-lockfile
            max_len: 131072
          - target: plugin_manifest
            cache_tag: plugin-manifest
            max_len: 262144
          - target: plugin_section
            cache_tag: plugin-section
            max_len: 524288
          - target: generated_project
            cache_tag: generated-project
            max_len: 4096
          - target: model_request
            cache_tag: model-request
            max_len: 262144
          - target: json_parameters
            cache_tag: json-parameters
            max_len: 65536
          - target: plugin_result
            cache_tag: plugin-result
            max_len: 65536
          - target: report_bundle
            cache_tag: report-bundle
            max_len: 262144
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      MAX_LEN: ${{ matrix.max_len }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: namespacelabs/nscloud-cache-action@v1.7.0
        if: runner.environment != 'github-hosted'
        with:
          cache: rust
          path: |
            ~/.rustup
            fuzz/target

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - uses: taiki-e/install-action@v2.90.1
        if: matrix.target == 'parser'
        with:
          tool: cargo-deny@0.20.2

      - name: Check generated dictionary
        run: |
          ./internals/generate-fuzz-dictionary.py
          git diff --exit-code fuzz/graphcal.dict

      - name: Check fuzz dependency policy
        if: matrix.target == 'parser'
        run: >-
          cargo deny
          --manifest-path fuzz/Cargo.toml
          --config fuzz/deny.toml
          --locked check
          --hide-inclusion-graph

      - name: Build fuzz target
        run: cargo +nightly fuzz build "$FUZZ_TARGET" --fuzz-dir fuzz

      - name: Smoke-test fuzz target
        run: >-
          cargo +nightly fuzz run "$FUZZ_TARGET"
          "fuzz/corpus/$FUZZ_TARGET"
          --fuzz-dir fuzz --
          -runs=250
          -max_len="$MAX_LEN"
          -timeout=10
          -dict=fuzz/graphcal.dict

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  fuzz-gate:
    needs: fuzz
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check fuzz results
        env:
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          if [[ "$FUZZ_RESULT" != "success" ]]; then
            echo "One or more fuzz jobs failed"
            exit 1
          fi
          echo "All fuzz jobs passed"

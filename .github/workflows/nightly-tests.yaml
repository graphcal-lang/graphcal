name: Nightly tests

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  release-profile:
    runs-on: ${{ github.repository == 'graphcal-lang/graphcal' && 'namespace-profile-8x16-ubuntu-2604' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: namespacelabs/nscloud-cache-action@v1.7.0
        if: runner.environment != 'github-hosted'
        with:
          cache: rust
          path: ~/.rustup

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install Wasm target for plugin end-to-end tests
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          key: nightly-release-profile

      - uses: $/.github/actions/report-engine-tools

      - name: Test optimized workspace with overflow checks
        run: cargo test --workspace --release

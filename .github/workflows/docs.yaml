name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: wasm-pack@0.15.0,just@1.58.0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: '1.4.0'
          node-version: '24.22.1'
          working-directory: web/playground
          run-install: false
          cache: true
      - name: Install locked frontend dependencies
        run: |
          vp -C web/playground install --frozen-lockfile
          vp -C web/view install --frozen-lockfile
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.x
      - run: pip install zensical==0.0.73
      - name: Build and verify documentation and standalone playground
        run: just docs-build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push'
    needs: build
    permissions:
      pages: write # Required to publish the Pages artifact.
      id-token: write # Required for trusted GitHub Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment

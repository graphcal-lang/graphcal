name: Dynamic safety

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  SAFETY_NIGHTLY: nightly-2026-02-21

jobs:
  dynamic-safety-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/dynamic-safety.yaml \
            Cargo.lock \
            Cargo.toml \
            crates/graphcal-compiler \
            crates/graphcal-eval \
            crates/graphcal-lsp \
            crates/graphcal-plugin
          diff_status=$?
          set -e

          case "$diff_status" in
            0) echo "relevant=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "relevant=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Failed to inspect pull-request changes" >&2; exit 1 ;;
          esac

  plugin-miri:
    needs: dynamic-safety-changes
    if: needs.dynamic-safety-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Miri toolchain
        run: rustup toolchain install "$SAFETY_NIGHTLY" --profile minimal --component miri,rust-src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dynamic-safety-miri

      - name: Prepare Miri sysroot
        run: cargo "+$SAFETY_NIGHTLY" miri setup

      - name: Exercise plugin ABI under Miri
        env:
          MIRIFLAGS: -Zmiri-symbolic-alignment-check -Zmiri-tree-borrows
        run: cargo "+$SAFETY_NIGHTLY" miri test -p graphcal-plugin --test abi_memory

  plugin-asan:
    needs: dynamic-safety-changes
    if: needs.dynamic-safety-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned sanitizer toolchain
        run: >-
          rustup toolchain install "$SAFETY_NIGHTLY" --profile minimal
          --component llvm-tools-preview,rust-src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dynamic-safety-asan

      - name: Exercise plugin ABI under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo "+$SAFETY_NIGHTLY" test -Zbuild-std
          --target x86_64-unknown-linux-gnu
          -p graphcal-plugin --test abi_memory

  lsp-loom:
    needs: dynamic-safety-changes
    if: needs.dynamic-safety-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dynamic-safety-loom

      - name: Exhaust LSP scheduling interleavings
        env:
          RUSTFLAGS: --cfg loom --check-cfg=cfg(loom)
        run: >-
          cargo test -p graphcal-lsp --release
          analysis_schedule_state::loom_tests -- --test-threads=1

  dynamic-safety-gate:
    needs: [dynamic-safety-changes, plugin-miri, plugin-asan, lsp-loom]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CHANGES_RESULT: ${{ needs.dynamic-safety-changes.result }}
          RELEVANT: ${{ needs.dynamic-safety-changes.outputs.relevant }}
          MIRI_RESULT: ${{ needs.plugin-miri.result }}
          ASAN_RESULT: ${{ needs.plugin-asan.result }}
          LOOM_RESULT: ${{ needs.lsp-loom.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Dynamic-safety change detection failed"
            exit 1
          fi

          results=("$MIRI_RESULT" "$ASAN_RESULT" "$LOOM_RESULT")
          expected="skipped"
          if [[ "$RELEVANT" == "true" ]]; then
            expected="success"
          fi

          for result in "${results[@]}"; do
            if [[ "$result" != "$expected" ]]; then
              echo "One or more dynamic-safety jobs had an unexpected result"
              exit 1
            fi
          done
          echo "Dynamic-safety jobs passed"

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --keep-going

      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features --keep-going

      - name: Rustfmt
        run: cargo fmt --check

      - name: Doc
        env:
          RUSTDOCFLAGS: "-Dwarnings"
        run: cargo doc --workspace --no-deps

      - name: Check
        run: cargo check --workspace

      - name: Verify no uncommitted changes
        run: git diff --exit-code

  public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-hawk@0.1.9

      - name: Check closed-world public surface
        run: >-
          cargo hawk check -D warnings
          --exclude-crate graphcal_compiler
          --exclude-crate graphcal_eval
          --exclude-crate graphcal_io
          --exclude-crate graphcal_package
          --exclude-crate graphcal_plugin
          --exclude-crate graphcal_plugin_abi
          --exclude-crate graphcal_plugin_host
          --exclude-crate graphcal_tenax
          --exclude-crate graphcal_test_support

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-deny@0.20.2

      - name: Check dependency policy
        run: cargo deny --locked check --hide-inclusion-graph

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install wasm32 target (plugin end-to-end tests)
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and independently check Lean specifications
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          build-args: --wfail
          leanchecker: true
          # The package is named `graphcal-formal`, which is not a Lean module
          # prefix. Tell leanchecker to check the compiled `Graphcal` library.
          leanchecker-args: Graphcal
          axiom-audit: true
          axiom-audit-root: Graphcal
          use-mathlib-cache: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Compare Rust V002 with the exhaustive Lean oracle
        env:
          GRAPHCAL_REQUIRED_BINDABILITY_ORACLE: ${{ github.workspace }}/formal/.lake/build/bin/required-bindability-oracle
        run: >-
          cargo test --package graphcal-compiler --lib
          required_bindability_matches_lean_oracle -- --ignored

  qa-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_VERSION: "0.12.x"
      UV_LOCKED: "1"
      UV_NO_SYNC: "1"
    steps:
      - name: Check out Graphcal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out QA corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: graphcal-lang/qa-corpus
          ref: main
          path: qa-corpus
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build Graphcal
        run: cargo build --locked --package graphcal

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: qa-corpus/.python-version

      - name: Install QA corpus runner
        working-directory: qa-corpus
        run: uv sync

      - name: Test Graphcal against QA corpus
        working-directory: qa-corpus
        run: >-
          uv run test-graphcal "$GITHUB_WORKSPACE/target/debug/graphcal"
          | tee "$GITHUB_WORKSPACE/qa-corpus-report.json"

      - name: Upload QA corpus report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-corpus-${{ github.sha }}
          path: qa-corpus-report.json
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install wasm32 target (plugin end-to-end tests)
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows

      # `--no-fail-fast` so a failure in one crate does not mask the remaining
      # crates. Windows is the newest platform here, so a round of CI should
      # report every portability gap at once rather than one per push.
      - name: Test native workspace on Windows
        run: cargo test --workspace --no-fail-fast

  wasm:
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: wasm-pack@0.15.0

      - name: Check browser Wasm crates
        run: >-
          cargo check
          --workspace
          --exclude graphcal
          --exclude graphcal-lsp
          --target wasm32-unknown-unknown

      - name: Test browser evaluator on Wasm
        run: wasm-pack test --node crates/graphcal-wasm

      - name: Smoke-test hydrated report artifacts
        run: |
          # Mirrors the `report-smoke` recipe in the justfile: build the
          # no-modules engine, build a hydrated report with it, and drive
          # the embedded payload through the prepared-project API in Node.
          rm -rf target/wasm-report/pkg
          wasm-pack build crates/graphcal-wasm \
            --target no-modules \
            --out-dir ../../target/wasm-report/pkg \
            --profile wasm-release \
            --no-typescript \
            --no-pack
          rm -f target/wasm-report/pkg/.gitignore
          cargo run -p graphcal -- report build tests/fixtures/valid/rocket.gcl \
            --output target/wasm-report/rocket.report.html
          node internals/report-hydration-smoke.mjs target/wasm-report/rocket.report.html

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: >-
          cargo llvm-cov
          --workspace
          --lcov
          --output-path lcov.info
          --fail-under-lines 84

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-hack

      - name: Check MSRV
        run: cargo hack check --workspace --rust-version --ignore-private

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  collect:
    needs: [checks, public-surface, dependency-policy, test, formal, qa-corpus, windows, wasm, coverage, msrv, typos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=("${{ needs.checks.result }}" "${{ needs.public-surface.result }}" "${{ needs.dependency-policy.result }}" "${{ needs.test.result }}" "${{ needs.formal.result }}" "${{ needs.qa-corpus.result }}" "${{ needs.windows.result }}" "${{ needs.wasm.result }}" "${{ needs.coverage.result }}" "${{ needs.msrv.result }}" "${{ needs.typos.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
          echo "All jobs passed"

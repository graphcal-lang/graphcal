name: Browser end-to-end

on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-pack@0.15.0,just@1.58.0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: '1.3.0'
          node-version: '24.21.0'
          working-directory: web/playground
          run-install: false
          cache: true
      - name: Install locked frontend dependencies
        run: |
          vp -C web/playground install --frozen-lockfile
          vp -C web/view install --frozen-lockfile
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - run: pip install zensical==0.0.68
      - name: Install Chromium for pull-request smoke tests
        if: github.event_name == 'pull_request'
        run: vp -C web/playground exec playwright install --with-deps chromium
      - name: Install all browser engines for the full suite
        if: github.event_name != 'pull_request'
        run: vp -C web/playground exec playwright install --with-deps chromium firefox webkit
      - name: Build the published site
        run: just docs-build
      - name: Run stable Chromium smoke tests on pull requests
        if: github.event_name == 'pull_request'
        run: vp -C web/playground exec playwright test --project=chromium --grep '@smoke'
      - name: Run full cross-browser playground suite on schedule or demand
        if: github.event_name != 'pull_request'
        run: vp -C web/playground exec playwright test
      - uses: $/.github/actions/report-engine-tools
        if: github.event_name != 'pull_request'
      - name: Verify offline SDK plugin reports in all browser engines
        if: github.event_name != 'pull_request'
        run: just report-plugin-browser-test
      - name: Verify offline dependency reports and worker cancellation
        if: github.event_name != 'pull_request'
        run: just report-package-browser-test
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-browser-failures
          path: web/playground/test-results
          if-no-files-found: ignore

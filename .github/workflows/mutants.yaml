name: Mutation tests

on:
  pull_request:
    paths:
      - ".cargo/mutants*.toml"
      - ".github/workflows/mutants.yaml"
      - "internals/check-mutants-ratchet.py"
      - "internals/mutation_baseline.py"
      - "internals/run-mutants-ratcheted.py"
      - "internals/update-mutants-baseline.py"
      - "internals/test_check_mutants_ratchet.py"
      - "internals/test_mutation_baseline.py"
      - "internals/test_run_mutants_ratcheted.py"
      - "internals/test_update_mutants_baseline.py"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/*.rs"
  schedule:
    # A discovery campaign runs every day. Monday's campaign also audits the
    # open baseline before excluding it from discovery.
    - cron: "17 3 * * 1"
    - cron: "17 3 * * 0,2-6"
  workflow_dispatch:
    inputs:
      audit-baseline:
        description: Audit open baseline findings before discovery
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: 27.1.0
  PYTHONDONTWRITEBYTECODE: "1"
  UV_VERSION: "0.12.x"

jobs:
  ratchet-tool:
    name: mutation ratchet tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Test mutation ratchet tool
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run -m unittest
          internals/test_check_mutants_ratchet.py
          internals/test_mutation_baseline.py
          internals/test_run_mutants_ratcheted.py
          internals/test_update_mutants_baseline.py

  changed-region:
    name: changed-region (informational)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}

      - name: Create pull-request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE_SHA"...HEAD -- '*.rs' > changed.diff

      - name: Test mutants in changed Rust regions
        run: >-
          cargo mutants --in-place --no-shuffle -vV
          --in-diff changed.diff

      - name: Upload changed-region report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-changed-${{ github.sha }}
          path: mutants.out
          if-no-files-found: ignore

  daily:
    name: daily (${{ matrix.shard.name }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: exact
            package: graphcal-compiler
            files: -f crates/graphcal-compiler/src/exact_rational.rs -f crates/graphcal-compiler/src/dimension.rs -f crates/graphcal-compiler/src/nat.rs
          - name: package
            package: graphcal-package
            files: -f crates/graphcal-package/src/lib.rs
          - name: plugin-manifest
            package: graphcal-plugin-abi
            files: -f crates/graphcal-plugin-abi/src/manifest.rs
          - name: plugin-section
            package: graphcal-plugin-abi
            files: -f crates/graphcal-plugin-abi/src/section.rs
          - name: presentation
            package: graphcal-eval
            files: -f crates/graphcal-eval/src/runtime_presentation.rs -f crates/graphcal-eval/src/eval/display.rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}

      - name: Run safety-core shard and check ratchet
        env:
          GRAPHCAL_MUTATION_AUDIT: >-
            ${{ (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 1')
            || (github.event_name == 'workflow_dispatch' && inputs.audit-baseline) }}
          MUTANT_PACKAGE: ${{ matrix.shard.package }}
          MUTANT_FILES: ${{ matrix.shard.files }}
        run: >-
          ./internals/run-mutants-ratcheted.py
          --in-place --no-shuffle
          -p "$MUTANT_PACKAGE" $MUTANT_FILES

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-${{ matrix.shard.name }}-${{ github.run_id }}
          path: |
            mutants.out
            mutants-audit/mutants.out
            mutation-campaign
          if-no-files-found: ignore

      # The plan makes completed audits authoritative while incrementally
      # written discovery outcomes remain useful after interruption.
      - name: Upload shard campaign for aggregation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-campaign-${{ matrix.shard.name }}-${{ github.run_id }}
          path: |
            mutation-campaign/plan.json
            mutants.out/outcomes.json
            mutants-audit/mutants.out/outcomes.json
          if-no-files-found: ignore

  update-baseline:
    name: open mutation finding PR
    if: >-
      ${{ always()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs:
      - ratchet-tool
      - daily
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # A failed shard may have no artifact, while other shards remain useful.
      - name: Download mutation campaigns
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutant-campaign-*-${{ github.run_id }}
          path: mutation-reports

      - name: Update mutation finding lifecycle states
        run: ./internals/update-mutants-baseline.py mutation-reports

      - name: Create or update mutation finding PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: .cargo/mutants-baseline.toml
          base: ${{ github.ref_name }}
          branch: >-
            ${{ github.ref_name == github.event.repository.default_branch
            && 'automation/mutants-baseline'
            || format('automation/mutants-baseline/{0}', github.ref_name) }}
          commit-message: "chore: track mutation test findings"
          delete-branch: true
          title: "chore: track mutation test findings"
          body: |
            ## Summary

            - Record newly missed or timed-out mutants found by the daily safety-core campaign.
            - Retain resolved, obsolete, and explicitly excluded findings as structured history.
            - Audit open findings weekly and reactivate regressions discovered later.

            Open findings should be resolved or explained in follow-up changes; the baseline is not a permanent exemption list.

            Latest campaign: [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) (see its mutation-report artifacts for diffs and logs).

            ## Breaking changes

            - [x] No breaking changes
            - [ ] Breaking changes; the `breaking change` label is applied

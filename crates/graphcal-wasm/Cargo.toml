[package]
name = "graphcal-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Optimize the shipped wasm for size instead of wasm-pack's default speed
# pass: the playground and hydrated reports carry this binary inline, and the
# CI budget caps the raw download at 5 MiB.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[dependencies]
graphcal-compiler.workspace = true
graphcal-eval.workspace = true
graphcal-io.workspace = true
graphcal-package.workspace = true
graphcal-report.workspace = true
miette.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[target.wasm32-unknown-unknown.dependencies]
js-sys = "0.3.104"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.126"

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[dev-dependencies]
serde_json.workspace = true

[package]
name = "graphcal-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Cross-crate tests may name declarations directly (`Value::*_with_owner`).
test-identities = ["graphcal-compiler/test-identities"]
# Cross-crate tests (`graphcal-project`) observe pipeline metrics and use
# test-only interpreter constructors. They see everything `test-identities`
# exposes too, so the two test surfaces never diverge.
test-internals = ["test-identities"]

[dependencies]
graphcal-compiler = { workspace = true }
hifitime.workspace = true
indexmap.workspace = true
jiff.workspace = true
miette.workspace = true
num-rational = "0.4.2"
num-traits = "0.2.19"
self_cell.workspace = true
thiserror.workspace = true

[dev-dependencies]
graphcal-compiler = { workspace = true, features = ["test-cancellation", "test-identities"] }
proptest.workspace = true

[lints]
workspace = true

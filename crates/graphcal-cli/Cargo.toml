[package]
name = "graphcal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
# Release CI stages the generated bundle here; it is packaged, never committed.
include = ["src/**", "build.rs", "build_support/**", "examples/**", "tests/**", "assets/report-engine/**", "Cargo.toml"]

[dependencies]
clap = { workspace = true }
fs2 = "0.4.3"
gix = { workspace = true }
graphcal-compiler = { workspace = true }
graphcal-eval = { workspace = true }
graphcal-fmt = { workspace = true }
graphcal-io = { workspace = true }
graphcal-lsp = { workspace = true }
graphcal-package = { workspace = true }
graphcal-plugin-host.workspace = true
graphcal-project = { workspace = true }
graphcal-report = { workspace = true }
graphcal-tenax = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
open = { workspace = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
stacker.workspace = true
tabled = { workspace = true }
tempfile = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
graphcal-eval = { workspace = true, features = ["test-identities"] }
graphcal-plugin-abi.workspace = true
indexmap.workspace = true
insta.workspace = true
serde_json.workspace = true
toml.workspace = true
wat.workspace = true

[lints]
workspace = true

[build-dependencies]
gix = { workspace = true, default-features = false, features = ["sha1"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

# `cargo binstall graphcal` downloads the archives that the `Release` workflow
# (dist) attaches to the GitHub Release; see RELEASING.md.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
# Never fall back to third-party binaries built by cargo-quickinstall.
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graphcal View</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="bar">
      <span class="bar-file" id="file">loading…</span>
      <span class="bar-unroll" id="unroll"></span>
      <span class="bar-right">
        <span class="modes">
          <button
            type="button"
            data-mode="fit"
            title="keep text readable; fold low-activity intermediates until the view fits"
          >
            fit
          </button>
          <button
            type="button"
            data-mode="overview"
            title="expand everything and scale the whole view to fit"
          >
            overview
          </button>
          <span class="zoom" id="zoom">100%</span>
        </span>
        <label class="bar-fixture"><select id="fixture"></select></label>
      </span>
    </header>
    <div class="formula" id="formula"></div>
    <div id="canvas" class="canvas">
      <div id="stage" class="stage">
        <main id="view" class="view"></main>
        <svg id="wires" class="wires" aria-hidden="true"></svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!-- The view's shell: the bar, the work area and the popovers. index.html
     takes it in through vite.config.ts; the VS Code webview bundle inserts
     it itself (webview.ts), so both hosts share one markup. -->
<header class="bar">
  <span class="bar-left">
    <button
      type="button"
      class="bar-crumb"
      id="crumb"
      title="show or hide the files of the project"
      hidden
    >
      <span class="crumb-chevron" aria-hidden="true">›</span>
      <span class="bar-origin" id="origin" hidden></span>
    </button>
    <span class="bar-file" id="file">loading…</span>
  </span>
  <span></span>
  <span class="bar-right">
    <span class="layouts" id="layouts" hidden>
      <button type="button" data-layout="code" title="code only">
        <svg viewBox="0 0 22 14" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="13" rx="2.5" />
          <path d="M4 4.5h10M4 7h13M4 9.5h8" />
        </svg>
      </button>
      <button type="button" data-layout="both" title="code and sheet">
        <svg viewBox="0 0 22 14" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="13" rx="2.5" />
          <path d="M11 0.5v13M3.5 4.5h5M3.5 7h5M3.5 9.5h3" />
          <rect x="13.5" y="3.5" width="5" height="3" class="fill" />
          <rect x="13.5" y="8" width="5" height="3" class="fill" />
        </svg>
      </button>
      <button type="button" data-layout="view" title="sheet only">
        <svg viewBox="0 0 22 14" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="13" rx="2.5" />
          <rect x="4" y="3.5" width="5" height="3" class="fill" />
          <rect x="13" y="3.5" width="5" height="3" class="fill" />
          <rect x="4" y="8" width="5" height="3" class="fill" />
          <rect x="13" y="8" width="5" height="3" class="fill" />
          <path d="M9 5h4M9 9.5h4" />
        </svg>
      </button>
    </span>
    <span class="bar-github" id="github" hidden></span>
  </span>
</header>
<div class="work" id="work">
  <aside class="explorer" id="explorer" hidden></aside>
  <section class="code" id="code" hidden>
    <header class="code-head">
      <span class="code-file" id="code-file"></span>
      <span class="code-note" id="code-note"></span>
    </header>
    <div class="code-body" id="code-body"></div>
  </section>
  <div class="split" id="split" hidden title="drag to resize"></div>
  <section class="start" id="start" hidden></section>
  <section class="sheet" id="sheet">
    <header class="sheet-head">
      <span class="sheet-name" id="sheet-name"></span>
      <span class="modes">
        <button type="button" data-mode="fit" title="everything at full size; pan to see the rest">
          fit
        </button>
        <button type="button" data-mode="overview" title="scale the whole view to fit">
          overview
        </button>
        <button type="button" class="zoom" id="zoom" title="zoom">100%</button>
      </span>
    </header>
    <div class="formula" id="formula"></div>
    <div id="canvas" class="canvas">
      <div id="stage" class="stage">
        <div id="panes" class="panes"></div>
        <svg id="cross" class="wires cross-wires" aria-hidden="true"></svg>
      </div>
    </div>
  </section>
</div>
<div id="zoom-popover" class="zoom-popover" hidden>
  <label class="zoom-field"
    ><input
      id="zoom-number"
      type="number"
      min="10"
      max="400"
      step="1"
      value="100"
      aria-label="zoom percent"
    />%</label
  >
</div>

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(\.snap|\.gcl)$'
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
        exclude: '^web/(playground|view|view-deploy)/pnpm-lock\.yaml$'
      # pnpm 12 emits a multi-document YAML lockfile; validate every document.
      - id: check-yaml
        name: check pnpm lockfile YAML
        files: '^web/(playground|view|view-deploy)/pnpm-lock\.yaml$'
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--enforce-all]
        # Vendored Vega bundles are intentional pinned assets. The generated
        # report engine belongs only in build outputs and release archives.
        # Output goldens pin every value of large sampled examples in full.
        exclude: '^(crates/graphcal-report/assets/.*\.min\.js|crates/graphcal-cli/tests/output_golden/.*\.json)$'
      - id: check-merge-conflict
      - id: check-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]
        # Fuzz seeds keep CRLF / lone-CR line endings on purpose (see .gitattributes).
        exclude: ^fuzz/corpus/
      # Rust crate attributes such as `#![no_main]` are not Unix shebangs.
      - id: check-shebang-scripts-are-executable
        exclude: ^(fuzz/fuzz_targets/.*|crates/.*/tests/.*)\.rs$
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: no-commit-to-branch

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: b0cff962ee693b9e612c097d22e71e0cba127447  # frozen: v0.3.2
    hooks:
      - id: rumdl

  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # frozen: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor

  # zizmor audits workflow *security*; it does not validate the Actions schema.
  # A job-level `if:` referencing the `matrix` context passed zizmor but made
  # GitHub fail to load the workflow entirely — a 0-job run that reported the
  # file path instead of the workflow name, so the mutation ratchet silently
  # gated nothing. actionlint checks context availability per key and catches it.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

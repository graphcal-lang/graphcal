# Generated and vendored browser bundles are code, not prose: their shortened
# identifiers trip the checker, and its auto-fix would corrupt the files (see
# each asset directory's README for provenance).
[files]
extend-exclude = [
  "crates/graphcal-cli/assets/report-engine/graphcal_wasm.js",
  "crates/graphcal-report/assets/*.min.js",
]

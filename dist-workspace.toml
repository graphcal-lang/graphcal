[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax).
# Keep in sync with .github/actions/install-dist.
cargo-dist-version = "0.33.0"
# .github/workflows/release.yaml was generated by `dist generate` and is now
# maintained by hand (pinned actions, per-job permissions, crates.io's
# Trusted Publishing workflow name), so do not check it for freshness.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# Build only the required packages, and individually
precise-builds = true
# Whether CI should trigger releases with dispatches instead of tag pushes
dispatch-releases = true
# Always mark releases as latest, ignoring semver semantics. Every Graphcal
# release is still a 0.0.1-alpha prerelease, and `releases/latest` must resolve.
force-latest = true
# Whether dist should create a Github Release or use an existing draft
create-release = true
# Which phase dist should use to create the GitHub release
github-release = "announce"
# Whether to enable GitHub Attestations
github-attestations = true
# When to generate GitHub Attestations
github-attestations-phase = "announce"
# Patterns to attest when creating attestations for release artifacts
github-attestations-filters = ["*.json", "*.sh", "*.ps1", "*.zip", "*.tar.gz"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Steps to run before `dist build`: the report-engine toolchain
github-build-setup = "../report-engine-build-setup.yaml"
# Plan jobs to run in CI
plan-jobs = ["./release-precondition"]
# Publish jobs to run in CI
publish-jobs = ["./publish-crates"]
# Every Graphcal release is a prerelease, and crates.io must get each one.
publish-prereleases = true

[dist.github-custom-runners]
global = "ubuntu-latest"
aarch64-apple-darwin = "macos-latest"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-latest"
x86_64-unknown-linux-musl = "ubuntu-latest"

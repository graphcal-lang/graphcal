#:tombi toml-version = "v1.0.0"
# TOML v1.1 support was added in Rust 1.94.

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/graphcal-cli"]

[workspace.package]
version = "0.0.1-alpha.25"
edition = "2024"
rust-version = "1.91"
description = "Type-safe, unit-aware, Git-friendly reactive programming language for engineering calculations"
readme = "README.md"
repository = "https://github.com/graphcal-lang/graphcal"
license = "MIT OR Apache-2.0"
keywords = ["calculations", "engineering", "reactive", "units"]
categories = ["compilers", "science"]

[workspace.dependencies]
arrow-array = "59.1.0"
arrow-ipc = "59.1.0"
arrow-schema = "59.1.0"
base64 = "0.23.1"
clap = { version = "4.5.58", features = ["derive"] }
gix = { version = "0.86.0", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "parallel", "sha1", "worktree-mutation"] }
graphcal-compiler = { path = "crates/graphcal-compiler", version = "0.0.1-alpha.25" }
graphcal-eval = { path = "crates/graphcal-eval", version = "0.0.1-alpha.25" }
graphcal-fmt = { path = "crates/graphcal-fmt", version = "0.0.1-alpha.25" }
graphcal-io = { path = "crates/graphcal-io", version = "0.0.1-alpha.25" }
graphcal-lsp = { path = "crates/graphcal-lsp", version = "0.0.1-alpha.25" }
graphcal-package = { path = "crates/graphcal-package", version = "0.0.1-alpha.25" }
graphcal-plugin-abi = { path = "crates/graphcal-plugin-abi", version = "0.0.1-alpha.25" }
graphcal-plugin-host = { path = "crates/graphcal-plugin-host", version = "0.0.1-alpha.25" }
graphcal-plugin-macros = { path = "crates/graphcal-plugin-macros", version = "0.0.1-alpha.25" }
graphcal-report = { path = "crates/graphcal-report", version = "0.0.1-alpha.25" }
graphcal-tenax = { path = "crates/graphcal-tenax", version = "0.0.1-alpha.25" }
graphcal-test-support = { path = "crates/graphcal-test-support" }
hifitime = "4.2.4"
indexmap = "2.13.0"
insta = "1.46.3"
jiff = "0.2.21"
logos = "0.16.1"
miette = "7.6.0"
open = "5.3.3"
petgraph = "0.8.3"
pretty = "0.12.5"
proc-macro2 = "1.0.106"
proptest = "1.10.0"
quote = "1.0.46"
rand = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
stacker = "0.1.24"
syn = "3.0.0"
tabled = { version = "0.21.0", default-features = false, features = ["std"] }
tempfile = "3.25.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
tower-lsp = "0.20"
unicode-width = "0.2.2"
walkdir = "2.5.0"
wasmi = "1.1.0"
wat = "1.252.0"

[workspace.lints.clippy]
all = "warn"
allow_attributes = { level = "warn", priority = 1 }
allow_attributes_without_reason = { level = "warn", priority = 1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }  # deny-by-default
dbg_macro = { level = "warn", priority = 1 }
decimal_literal_representation = { level = "warn", priority = 1 }
derive_partial_eq_without_eq = { level = "allow", priority = 1 }  # We implement `Eq` only when necessary
disallowed_methods = { level = "warn", priority = 1 }
else_if_without_else = { level = "warn", priority = 1 }
expect_used = { level = "warn", priority = 1 }
indexing_slicing = { level = "allow", priority = 1 }  # TODO: change to "warn" later
missing_errors_doc = { level = "allow", priority = 1 }  # TODO: change to "warn" later
missing_panics_doc = { level = "allow", priority = 1 }  # TODO: change to "warn" later
multiple_crate_versions = { level = "allow", priority = 1 }  # There is nothing we can do about this
nursery = { level = "warn", priority = -1 }
panic = { level = "warn", priority = 1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
print_stderr = { level = "warn", priority = 1 }
print_stdout = { level = "warn", priority = 1 }
style = { level = "warn", priority = -1 }  # warn-by-default
suspicious = { level = "warn", priority = -1 }
todo = { level = "warn", priority = 1 }
undocumented_unsafe_blocks = { level = "warn", priority = 1 }
unimplemented = { level = "warn", priority = 1 }
unreachable = { level = "warn", priority = 1 }
unwrap_used = { level = "warn", priority = 1 }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
# missing-docs = "warn"
unsafe-code = "warn"

# Keep useful backtraces while minimizing debug-build codegen and link time.
[profile.dev]
debug = "line-tables-only"

# Dependencies generally do not need source-level debug information.
[profile.dev.package."*"]
debug = false

[profile.release]
overflow-checks = true

# Keep shipped browser/report WebAssembly small without slowing every native
# release build. wasm-pack selects this profile explicitly.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1

# Opt in to full workspace debug information when using a debugger.
[profile.debugging]
inherits = "dev"
debug = true

# Release-optimized binaries with symbols for sampling profilers such as samply.
[profile.profiling]
inherits = "release"
debug = true

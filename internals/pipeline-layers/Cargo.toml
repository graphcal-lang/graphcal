[package]
name = "graphcal-pipeline-layers"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Syntax-aware dependency-layer ratchet for Graphcal"

[workspace]

[dependencies]
anyhow = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
syn = { version = "3", features = ["full", "visit"] }
thiserror = "2.0.20"
toml = "1"

[dev-dependencies]
tempfile = "=3.27.0"

[package]
name = "graphcal-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
graphcal-compiler = { path = "../crates/graphcal-compiler", version = "0.0.1-alpha.23" }
graphcal-fmt = { path = "../crates/graphcal-fmt", version = "0.0.1-alpha.23" }
graphcal-package = { path = "../crates/graphcal-package", version = "0.0.1-alpha.23" }
graphcal-plugin-abi = { path = "../crates/graphcal-plugin-abi", version = "0.0.1-alpha.23" }
libfuzzer-sys = "0.4"

# Keep nightly-only fuzz dependencies out of the stable production workspace.
[workspace]
members = ["."]

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formatter"
path = "fuzz_targets/formatter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "package_manifest"
path = "fuzz_targets/package_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "package_lockfile"
path = "fuzz_targets/package_lockfile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_manifest"
path = "fuzz_targets/plugin_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_section"
path = "fuzz_targets/plugin_section.rs"
test = false
doc = false
bench = false

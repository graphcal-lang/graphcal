[package]
name = "graphcal-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Keep nightly-only fuzz dependencies out of the stable production workspace.
[workspace]
members = ["."]

[[bin]]
bench = false
doc = false
name = "parser"
path = "fuzz_targets/parser.rs"
test = false

[[bin]]
bench = false
doc = false
name = "formatter"
path = "fuzz_targets/formatter.rs"
test = false

[[bin]]
bench = false
doc = false
name = "package_manifest"
path = "fuzz_targets/package_manifest.rs"
test = false

[[bin]]
bench = false
doc = false
name = "package_lockfile"
path = "fuzz_targets/package_lockfile.rs"
test = false

[[bin]]
bench = false
doc = false
name = "plugin_manifest"
path = "fuzz_targets/plugin_manifest.rs"
test = false

[[bin]]
bench = false
doc = false
name = "plugin_section"
path = "fuzz_targets/plugin_section.rs"
test = false

[[bin]]
bench = false
doc = false
name = "generated_project"
path = "fuzz_targets/generated_project.rs"
test = false

[dependencies]
graphcal-compiler = { path = "../crates/graphcal-compiler" }
graphcal-eval = { path = "../crates/graphcal-eval" }
graphcal-fmt = { path = "../crates/graphcal-fmt" }
graphcal-io = { path = "../crates/graphcal-io" }
graphcal-package = { path = "../crates/graphcal-package" }
graphcal-plugin-abi = { path = "../crates/graphcal-plugin-abi" }
graphcal-test-support = { path = "../crates/graphcal-test-support" }
libfuzzer-sys = "0.4"

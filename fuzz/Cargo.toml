[package]
name = "graphcal-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Keep nightly-only fuzz dependencies out of the stable production workspace.
[workspace]
members = ["."]

[[bin]]
bench = false
doc = false
name = "parser"
path = "fuzz_targets/parser.rs"
test = false

[[bin]]
bench = false
doc = false
name = "formatter"
path = "fuzz_targets/formatter.rs"
test = false

[[bin]]
bench = false
doc = false
name = "package_manifest"
path = "fuzz_targets/package_manifest.rs"
test = false

[[bin]]
bench = false
doc = false
name = "package_lockfile"
path = "fuzz_targets/package_lockfile.rs"
test = false

[[bin]]
bench = false
doc = false
name = "plugin_manifest"
path = "fuzz_targets/plugin_manifest.rs"
test = false

[[bin]]
bench = false
doc = false
name = "plugin_section"
path = "fuzz_targets/plugin_section.rs"
test = false

[[bin]]
bench = false
doc = false
name = "generated_project"
path = "fuzz_targets/generated_project.rs"
test = false

[[bin]]
bench = false
doc = false
name = "json_parameters"
path = "fuzz_targets/json_parameters.rs"
test = false

[[bin]]
bench = false
doc = false
name = "model_request"
path = "fuzz_targets/model_request.rs"
test = false

[[bin]]
bench = false
doc = false
name = "report_bundle"
path = "fuzz_targets/report_bundle.rs"
test = false

[[bin]]
bench = false
doc = false
name = "plugin_result"
path = "fuzz_targets/plugin_result.rs"
test = false

[dependencies]
arrow-ipc = "60.0.0"
graphcal-compiler = { path = "../crates/graphcal-compiler" }
graphcal-eval = { path = "../crates/graphcal-eval" }
graphcal-fmt = { path = "../crates/graphcal-fmt" }
graphcal-io = { path = "../crates/graphcal-io" }
graphcal-model-protocol = { path = "../crates/graphcal-model-protocol", features = ["arrow"] }
graphcal-package = { path = "../crates/graphcal-package" }
graphcal-plugin-abi = { path = "../crates/graphcal-plugin-abi" }
graphcal-project = { path = "../crates/graphcal-project" }
graphcal-test-support = { path = "../crates/graphcal-test-support" }
indexmap = "2.13.0"
libfuzzer-sys = "0.4"
miette = "7.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
# `Ratio` negation is total (symmetric range) and its other operators return `Result`.
arithmetic-side-effects-allowed = ["graphcal_compiler::ratio::Ratio"]

[[disallowed-methods]]
path = "core::option::Option::unwrap_or_default"
reason = "Silent fallbacks can mask absent-state bugs (issues #1223-#1241). Return an error, establish a typed default at one boundary, or add an expectation explaining why absence is legal."

[[disallowed-methods]]
path = "core::result::Result::unwrap_or_default"
reason = "Swallowing an error and fabricating a default can hide rejected states (issues #1223-#1241). Handle the error, or add an expectation explaining why degradation is intentional."

[[disallowed-methods]]
path = "graphcal_compiler::tir::typed::checked::CheckedDag::body_scope"
reason = "A body scope resolves body handles in its DAG's frame. Only the execution plan (`SealedDag::body_scope`) and the provisional constant scope select the DAG a body runs in; everything else must go through `EvalContext` so code evaluating a body cannot pick its frame (Q3 condition 4)."
